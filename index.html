<!DOCTYPE html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --accent: #38bdf8;
            --bg: #0b0f19;
            --card-bg: rgba(22, 30, 49, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; }
        body { background: linear-gradient(135deg, #070a12 0%, #0c1222 50%, #171c38 100%); color: var(--text-main); min-height: 100vh; padding: 30px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 36px; padding: 30px 20px; background: rgba(15, 23, 42, 0.8); border-radius: 20px; border: 1px solid var(--card-border); backdrop-filter: blur(14px); }
        h1 { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .subtitle { color: var(--text-sub); font-size: 14.5px; line-height: 1.6; }
        .badge-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
        .badge { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
        .section-title { font-size: 18px; font-weight: 700; color: #e2e8f0; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 36px; }
        .region-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; text-decoration: none; color: inherit; transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .region-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .region-name { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .region-meta { font-size: 13px; color: var(--text-sub); margin-bottom: 12px; }
        .card-btn { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center; }
        footer { text-align: center; color: var(--text-sub); font-size: 13px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--card-border); }
    </style>
</head>
<body>

                <span class="badge">🩺 型態別：西醫</span>

                <span class="badge">🛡️ 零病患個資 · 純官方公眾資料</span>
            </div>
        </header>

        <div class="section-title">📍 已發布行政區專題門診網頁</div>
        <div class="grid" id="regionGrid">
            <!-- 預設收錄萬華區 -->
            <a href="臺北市/萬華區/index.html" class="region-card">
                <div>
                    <div class="region-name">臺北市 萬華區</div>
                    <div class="region-meta">收錄 71 家特約西醫基層診所<br>更新：民國 115 年 9 月 (最新版)</div>
                </div>
                <div class="card-btn">進入門診全覽 ❯</div>

        <footer>

    </div>
</body>
</html>
